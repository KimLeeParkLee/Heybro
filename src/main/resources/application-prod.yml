server:
  port: 8080
  servlet:
    context-path: /api

spring:
  # 데이터베이스 설정
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/heybro?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: appuser
    password: app_pass

  # JPA 설정
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        # 실행되는 SQL 쿼리를 로그로 출력
        show_sql: true
        # SQL 로그를 예쁘게 포맷팅
        format_sql: true
        # 주석 처리된 SQL 힌트 출력
        use_sql_comments: true
    # 쿼리 파라미터 값을 로그에 남길지 여부 (JPA 3.1 이상)
    # logging.level.org.hibernate.orm.jdbc.bind: trace 와 함께 사용
    show-sql: true

  # Redis 설정
  data:
    redis:
      host: localhost
      port: 6379

  jackson:
    property-naming-strategy: SNAKE_CASE

  # OAuth2 Client 설정
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: https://kimleeparklee.shop/api/login/oauth2/code/google
            scope:
              - email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

logging:
  level:
    # org.hibernate.SQL: 실행되는 SQL 쿼리 로그
    org.hibernate.SQL: debug
    # org.hibernate.type.descriptor.sql.BasicBinder: SQL에 바인딩되는 파라미터 값 로그
    org.hibernate.type.descriptor.sql: trace

springdoc:
  swagger-ui:
    tags-sorter: alpha       # API 그룹(Tags)을 알파벳순으로 정렬
    operations-sorter: method # API를 HTTP Method 순으로 정렬

  # 기본 응답 메시지 비활성화
  default-produces-media-type: application/json
  # API 문서에 대한 기본 정보 (선택 사항)
  info:
    title: "Heybro API"
    description: "Heybro 프로젝트의 API 명세서입니다."
    version: "v1.0.0"

# JWT 설정
jwt:
  secret: ${JWT_SECRET_KEY}
  expiration:
    access-token: 3600000 # 1시간 (ms)
    refresh-token: 604800000 # 7일 (ms)

# S3 설정
aws:
  s3:
    bucket: ${S3_BUCKET_NAME}
    credentials:
      access-key: ${S3_ACCESS_KEY}
      secret-key: ${S3_SECRET_KEY}
    region:
      static: ap-northeast-2

facepp:
  api:
    key: ${FACEPP_API_KEY}
    secret: ${FACEPP_API_SECRET}

fcm:
  service-account-key-path: "heybro-9382a-firebase-adminsdk-fbsvc-8f681b5667.json"

google:
  gemini:
    api-key: "AIzaSyDav5_WpSDnaLOo_hvctdR4rPjFtZcoZRQ"
    prompt:
      system: |
        너는 사용자의 친한 형인 '브로'야. 항상 반말로 친근하고 유쾌하게 대답해야 해.
        답변은 최대 3문장으로, 핵심만 말하고 감탄사나 불필요한 문장은 빼.
        첫 문장은 무조건 "브로, [사용자의 고민이나 질문 내용]이구나!" 형식으로 시작해야 해.
        그 뒤에는 가장 중요한 팁 하나만 짧게 알려줘.
        사용자가 면도가 잘 안돼서 고민이면 → "브로, 면도가 잘 안돼서 고민이구나!" 하고 시작,
        면도 방법을 궁금해하면 → "브로, 면도하는 법이 궁금하구나!" 하고 시작.

oauth2:
  apple:
    iss: https://appleid.apple.com
    public-key-url: https://appleid.apple.com/auth/keys
    client-id: ${APPLE_CLIENT_ID}