# 통합 테스트용 설정. 로컬 MySQL(heybro_test)·Redis 가 필요하며, 비밀 값은 모두 더미다.
server:
  servlet:
    context-path: /api

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/heybro_test?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: heybro
    password: heybro1234
    hikari:
      maximum-pool-size: 30
  jpa:
    hibernate:
      ddl-auto: create
    open-in-view: false
    properties:
      hibernate:
        generate_statistics: true   # 쿼리 수 검증용
  data:
    redis:
      host: localhost
      port: 6379
  jackson:
    property-naming-strategy: SNAKE_CASE
    time-zone: Asia/Seoul
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret
            redirect-uri: http://localhost:8080/api/login/oauth2/code/google
            scope: [email]
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

jwt:
  secret: dGVzdC1qd3Qtc2VjcmV0LWtleS1mb3ItaW50ZWdyYXRpb24tdGVzdHMtb25seS0wMDAwMDAwMA==
  expiration:
    access-token: 3600000
    refresh-token: 604800000

aws:
  s3:
    bucket: test-bucket
    credentials:
      access-key: TESTACCESSKEY
      secret-key: testsecretkeytestsecretkey
    region:
      static: ap-northeast-2

facepp:
  api:
    key: test
    secret: test

fcm:
  service-account-key-path: unused-in-tests.json

google:
  gemini:
    api-key: test
    prompt:
      system: test prompt

oauth2:
  apple:
    iss: https://appleid.apple.com
    public-key-url: https://appleid.apple.com/auth/keys
    client-id: test
