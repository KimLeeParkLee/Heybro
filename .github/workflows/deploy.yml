name: Deploy to GCP VM

on:
  push:
    branches: [ "backend" ] # backend 브랜치에 푸시될 때 실행

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # 1. Docker Hub에 로그인
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 2. Docker 이미지 빌드 및 푸시
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: rladbsk/heybro-backend:latest # Docker Hub ID와 앱 이름

      # 3. SSH로 GCP 서버에 접속하여 배포 스크립트 실행
      - name: Deploy to GCP VM via SSH (with ELK & Prometheus/Grafana)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.GCP_SSH_HOST }}
          username: ${{ secrets.GCP_SSH_USERNAME }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            # === 1. 필수 디렉토리 생성 및 권한 설정 ===
            sudo mkdir -p /etc/heybro/secrets
            sudo mkdir -p /home/${{ secrets.GCP_SSH_USERNAME }}/monitoring # 통합 설정 파일용 디렉토리
            sudo mkdir -p /home/${{ secrets.GCP_SSH_USERNAME }}/heybro-logs # 백엔드/Filebeat 로그 공유용
            sudo chmod -R 777 /home/${{ secrets.GCP_SSH_USERNAME }}/heybro-logs
            
            # === 2. 시크릿 파일 생성 (생략 없음) ===
            echo '${{ secrets.FCM_KEY_JSON }}' | sudo tee /etc/heybro/secrets/firebase-key.json > /dev/null

            # ==========================================================
            #   ⭐ 로깅 (ELK) 및 모니터링 (P+G) 설정 파일 생성 시작 ⭐
            # ==========================================================

            # --- 2-1. Filebeat 설정 파일 생성 (로그) ---
            echo '
            filebeat.inputs:
            - type: filestream
              enabled: true
              paths:
                - /var/log/my-app-logs/*.log  # Filebeat 컨테이너 내부 경로
            output.elasticsearch:
              hosts: ["http://elasticsearch:9200"]
            ' | sudo tee /home/${{ secrets.GCP_SSH_USERNAME }}/monitoring/filebeat.yml > /dev/null

            # --- 2-2. Prometheus 설정 파일 생성 (메트릭 수집 타겟) ---
            echo '
            global:
              scrape_interval: 15s

            scrape_configs:
              - job_name: "prometheus"
                static_configs:
                  - targets: ["localhost:9090"]
            
              - job_name: "node_exporter"
                static_configs:
                  - targets: ["node_exporter:9100"] # 서버 시스템 메트릭
            
              - job_name: "heybro_backend_app" # 백엔드 애플리케이션 메트릭
                static_configs:
                  - targets: ["host.docker.internal:8080"] # 백엔드 앱의 /metrics 엔드포인트 (포트 확인 필수)
            ' | sudo tee /home/${{ secrets.GCP_SSH_USERNAME }}/monitoring/prometheus.yml > /dev/null

            # --- 2-3. 통합 Docker Compose 파일 생성 (ELK + Prometheus + Grafana) ---
            echo '
            version: "3.8"
            services:
              # [1] 로깅 시스템: Elasticsearch
              elasticsearch:
                image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
                container_name: elasticsearch
                environment:
                  - xpack.security.enabled=false
                  - discovery.type=single-node
                  - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
                ulimits:
                  memlock:
                    soft: -1
                    hard: -1
                volumes:
                  - esdata:/usr/share/elasticsearch/data
                ports:
                  - 9200:9200
              # [2] 로깅 시스템: Kibana (로그 시각화/검색)
              kibana:
                image: docker.elastic.co/kibana/kibana:8.11.1
                container_name: kibana
                ports:
                  - 5601:5601
                environment:
                  - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
                depends_on:
                  - elasticsearch
              # [3] 로깅 시스템: Filebeat (로그 수집)
              filebeat:
                image: docker.elastic.co/beats/filebeat:8.11.1
                container_name: filebeat
                user: root
                volumes:
                  - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
                  - /home/${{ secrets.GCP_SSH_USERNAME }}/heybro-logs:/var/log/my-app-logs:ro 
                  - filebeatdata:/usr/share/filebeat/data
                depends_on:
                  - elasticsearch

              # [4] 모니터링 시스템: Prometheus (메트릭 저장소)
              prometheus:
                image: prom/prometheus:latest
                container_name: prometheus
                volumes:
                  - ./prometheus.yml:/etc/prometheus/prometheus.yml
                  - prometheus_data:/prometheus
                ports:
                  - 9090:9090
                command:
                  - '--config.file=/etc/prometheus/prometheus.yml'
                  - '--storage.tsdb.path=/prometheus'
              # [5] 모니터링 시스템: Grafana (메트릭 시각화/경고)
              grafana:
                image: grafana/grafana:latest
                container_name: grafana
                ports:
                  - 3000:3000
                volumes:
                  - grafana_data:/var/lib/grafana
                environment:
                  - GF_SECURITY_ADMIN_PASSWORD=admin # 초기 비밀번호 설정
                depends_on:
                  - prometheus
              # [6] 모니터링 시스템: Node Exporter (서버 시스템 메트릭 수집)
              node_exporter:
                image: quay.io/prometheus/node-exporter:latest
                container_name: node_exporter
                command:
                  - '--path.rootfs=/host'
                pid: host
                volumes:
                  - /:/host:ro,rslave
                ports:
                  - 9100:9100

            volumes:
              esdata:
                driver: local
              filebeatdata:
                driver: local
              prometheus_data:
              grafana_data:
            ' | sudo tee /home/${{ secrets.GCP_SSH_USERNAME }}/monitoring/docker-compose.all.yml > /dev/null

            # ==========================================================
            #   ⭐ 스택 실행 및 백엔드 배포 ⭐
            # ==========================================================

            # 기존 ELK, P+G 스택 중지 및 삭제 (안정성을 위해)
            cd /home/${{ secrets.GCP_SSH_USERNAME }}/monitoring
            docker-compose -f docker-compose.all.yml down || true

            # 통합 스택 실행
            docker-compose -f docker-compose.all.yml up -d

            # Docker Hub에서 최신 이미지 받기
            docker pull rladbsk/heybro-backend:latest

            # 기존에 실행 중인 컨테이너가 있으면 중지 및 삭제
            docker stop my-app-container || true
            docker rm my-app-container || true

            # 받은 이미지로 새 컨테이너 실행 (로그 볼륨 추가됨)
            docker run -d --name my-app-container --network="host" \
              -v /etc/heybro/secrets/firebase-key.json:/app/secrets/firebase-key.json \
              -v /home/${{ secrets.GCP_SSH_USERNAME }}/heybro-logs:/app/logs \
              -e "FCM_KEY_PATH=/app/secrets/firebase-key.json" \
              -e "SPRING_PROFILES_ACTIVE=prod" \
              -e "JAVA_OPTS=-Duser.timezone=Asia/Seoul" \
              -e "JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}" \
              -e "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" \
              -e "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" \
              -e "KAKAO_CLIENT_ID=${{ secrets.KAKAO_CLIENT_ID }}" \
              -e "S3_ACCESS_KEY=${{ secrets.S3_ACCESS_KEY }}" \
              -e "S3_SECRET_KEY=${{ secrets.S3_SECRET_KEY }}" \
              -e "S3_BUCKET_NAME=${{ secrets.S3_BUCKET_NAME }}" \
              -e "FACEPP_API_KEY=${{ secrets.FACEPP_API_KEY }}" \
              -e "FACEPP_API_SECRET=${{ secrets.FACEPP_API_SECRET }}" \
              -e "APPLE_CLIENT_ID=${{ secrets.APPLE_CLIENT_ID }}" \
              -e "MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}" \
              -e "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" \
              -e "MYSQL_USERNAME=${{ secrets.MYSQL_USERNAME }}" \
              rladbsk/heybro-backend:latest