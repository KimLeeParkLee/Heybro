#            token-uri: https://nid.naver.com/oauth2.0/token
#            user-info-uri: https://openapi.naver.com/v1/nid/me
#            user-name-attribute: response


logging:
  level:
    # org.hibernate.SQL: 실행되는 SQL 쿼리 로그
    org.hibernate.SQL: debug
    # org.hibernate.type.descriptor.sql.BasicBinder: SQL에 바인딩되는 파라미터 값 로그
    org.hibernate.type.descriptor.sql: trace

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha       # API 그룹(Tags)을 알파벳순으로 정렬
    operations-sorter: method # API를 HTTP Method 순으로 정렬
  # API 문서 기본 정보 설정
  api-docs:
    path: /api-docs          # API 명세서(JSON) 경로 (기본값: /v3/api-docs)
  # 기본 응답 메시지 비활성화
  default-produces-media-type: application/json
  # API 문서에 대한 기본 정보 (선택 사항)
  info:
    title: "Heybro API"
    description: "Heybro 프로젝트의 API 명세서입니다."
    version: "v1.0.0"
