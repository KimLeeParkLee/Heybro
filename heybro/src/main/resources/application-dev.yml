server:
  port: 8080

spring:
  # 데이터베이스 설정
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/heybro?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: 1234

  # JPA 설정
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        # 실행되는 SQL 쿼리를 로그로 출력
        show_sql: true
        # SQL 로그를 예쁘게 포맷팅
        format_sql: true
        # 주석 처리된 SQL 힌트 출력
        use_sql_comments: true
    # 쿼리 파라미터 값을 로그에 남길지 여부 (JPA 3.1 이상)
    # logging.level.org.hibernate.orm.jdbc.bind: trace 와 함께 사용
    show-sql: true

  # Redis 설정
  redis:
    data:
      host: localhost
      port: 6379

